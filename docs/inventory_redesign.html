<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uniform Stock Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#1b2330;--mu:#6a7483;--bd:#dde1e8;--ac:#1f4e9c;--bad:#c0392b;--ok:#1e8449;--warn:#b9770e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212b;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2c3441;--ac:#6ea0f0;--bad:#ec7063;--ok:#58d68d;--warn:#f0b35a}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212b;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2c3441;--ac:#6ea0f0;--bad:#ec7063;--ok:#58d68d;--warn:#f0b35a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px 0}h1{font-size:19px;margin:0 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font-size:14px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:0 16px 40px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.stat b{display:block;font-size:24px}.stat span{color:var(--mu);font-size:13px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
label{font-size:12px;color:var(--mu);display:block}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font-size:14px}
.btn{padding:9px 14px;border:0;border-radius:6px;background:var(--ac);color:#fff;font-size:14px;cursor:pointer}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:16px}
.low{color:var(--bad);font-weight:600}.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.mu{color:var(--mu);font-size:13px}
</style></head><body>
<header><h1>🛡️ Uniform Stock Tracker</h1></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const K='uniformTracker1';
let S={items:[],tx:[],view:'dash'};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify({items:S.items,tx:S.tx}))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const TYPES=['Received','Issue to site','Return from site','Damaged','Lost'];
const tabs=[['dash','Dashboard'],['items','Items'],['tx','Movements'],['sites','Sites'],['dmg','Damaged'],['order','Next Order']];

function calc(){
  const m={};S.items.forEach(i=>m[i.id]={store:+i.open||0,site:{},dmg:0,lost:0,site_total:0});
  S.tx.forEach(t=>{const c=m[t.item];if(!c)return;const q=+t.qty,s=t.site||'';
    if(t.type==='Received')c.store+=q;
    else if(t.type==='Issue to site'){c.store-=q;c.site[s]=(c.site[s]||0)+q}
    else if(t.type==='Return from site'){c.store+=q;c.site[s]=(c.site[s]||0)-q}
    else if(t.type==='Damaged'||t.type==='Lost'){const k=t.type==='Damaged'?'dmg':'lost';c[k]+=q;if(s)c.site[s]=(c.site[s]||0)-q;else c.store-=q}});
  Object.values(m).forEach(c=>c.site_total=Object.values(c.site).reduce((a,b)=>a+b,0));
  return m;}
const nm=i=>esc(i.name+(i.size?' ('+i.size+')':''));
const sites=()=>[...new Set(S.tx.map(t=>t.site).filter(Boolean))].sort();

function render(){
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${S.view===k?'on':''}" onclick="S.view='${k}';render()">${l}</button>`).join('');
  const m=calc();let h='';
  if(S.view==='dash'){
    const low=S.items.filter(i=>m[i.id].store<=+i.min);
    const tot=f=>S.items.reduce((a,i)=>a+f(m[i.id]),0);
    h=`<div class="grid"><div class="stat"><b>${tot(c=>c.store)}</b><span>In store</span></div>
    <div class="stat"><b>${tot(c=>c.site_total)}</b><span>At sites</span></div>
    <div class="stat"><b>${tot(c=>c.dmg)}</b><span>Damaged (total)</span></div>
    <div class="stat"><b class="${low.length?'low':''}">${low.length}</b><span>Items low</span></div></div>
    <div class="card"><h2>Stock summary</h2>${itemsTable(m)}</div>`;
    if(!S.items.length)h+=`<p class="mu">Start by adding uniform items in the <b>Items</b> tab.</p>`;
  }
  if(S.view==='items'){
    h=`<div class="card"><h2>Add uniform item</h2><form onsubmit="addItem(event)">
    <div><label>Item name</label><input name="name" placeholder="Shirt, Trouser, Cap, Shoes…" required></div>
    <div><label>Size</label><input name="size" placeholder="M / 40 / 9"></div>
    <div><label>Opening stock</label><input name="open" type="number" min="0" value="0"></div>
    <div><label>Reorder when ≤</label><input name="min" type="number" min="0" value="5"></div>
    <div><label>Target stock</label><input name="target" type="number" min="0" value="20"></div>
    <button class="btn">Add</button></form></div>
    <div class="card"><h2>All items</h2><div class="tw"><table><tr><th>Item</th><th>Opening</th><th>Reorder ≤</th><th>Target</th><th></th></tr>
    ${S.items.map(i=>`<tr><td>${nm(i)}</td><td>${i.open}</td><td>${i.min}</td><td>${i.target}</td><td><button class="x" onclick="delItem('${i.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan=5 class="mu">No items yet</td></tr>'}</table></div></div>`;
  }
  if(S.view==='tx'){
    h=`<div class="card"><h2>Record movement</h2><form onsubmit="addTx(event)">
    <div><label>Date</label><input name="date" type="date" value="${today()}" required></div>
    <div><label>Type</label><select name="type">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
    <div><label>Item</label><select name="item" required>${S.items.map(i=>`<option value="${i.id}">${nm(i)}</option>`).join('')}</select></div>
    <div><label>Quantity</label><input name="qty" type="number" min="1" value="1" required></div>
    <div><label>Site / Guard (if any)</label><input name="site" list="sl" placeholder="Site name"><datalist id="sl">${sites().map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div>
    <div><label>Note</label><input name="note" placeholder="Reason / supplier"></div>
    <button class="btn">Save</button></form>
    <p class="mu">Issue/Return need a site. For Damaged/Lost, leave site empty if it was in store.</p></div>
    <div class="card"><h2>History</h2>${txTable(S.tx)}</div>`;
  }
  if(S.view==='sites'){
    const ss=sites();
    h=`<div class="card"><h2>Uniforms at each site</h2><div class="tw"><table><tr><th>Item</th>${ss.map(s=>`<th>${esc(s)}</th>`).join('')}<th>Total</th></tr>
    ${S.items.map(i=>`<tr><td>${nm(i)}</td>${ss.map(s=>`<td>${m[i.id].site[s]||0}</td>`).join('')}<td><b>${m[i.id].site_total}</b></td></tr>`).join('')||'<tr><td class="mu">No data</td></tr>'}</table></div>
    ${ss.length?'':'<p class="mu">Issue items to a site in Movements and they will show here.</p>'}</div>`;
  }
  if(S.view==='dmg'){
    h=`<div class="card"><h2>Damaged &amp; lost log</h2>${txTable(S.tx.filter(t=>t.type==='Damaged'||t.type==='Lost'))}</div>`;
  }
  if(S.view==='order'){
    const need=S.items.filter(i=>m[i.id].store<=+i.min).map(i=>({i,q:Math.max(0,+i.target-m[i.id].store)}));
    h=`<div class="card"><h2>Next order (items at or below reorder level)</h2><div class="tw"><table><tr><th>Item</th><th>In store</th><th>Reorder ≤</th><th>Order qty</th></tr>
    ${need.map(({i,q})=>`<tr><td>${nm(i)}</td><td class="low">${m[i.id].store}</td><td>${i.min}</td><td><b>${q}</b></td></tr>`).join('')||'<tr><td colspan=4 class="mu">Nothing to order right now 👍</td></tr>'}</table></div>
    <div class="row" style="margin-top:12px"><button class="btn g" onclick="exportCSV('order')">Download order CSV</button></div></div>`;
  }
  h+=`<div class="row"><button class="btn g" onclick="exportCSV('all')">Export all movements (CSV)</button>
  <button class="btn g" onclick="backup()">Backup data</button>
  <label class="btn g" style="margin:0;cursor:pointer">Restore backup<input type="file" accept=".json" hidden onchange="restore(event)"></label></div>
  <p class="mu">Data is saved in this browser on this device. Use Backup regularly.</p>`;
  $('#app').innerHTML=h;
}
function itemsTable(m){
  return `<div class="tw"><table><tr><th>Item</th><th>In store</th><th>At sites</th><th>Damaged</th><th>Lost</th><th>Status</th></tr>
  ${S.items.map(i=>{const c=m[i.id],lo=c.store<=+i.min;return `<tr><td>${nm(i)}</td><td class="${lo?'low':''}">${c.store}</td><td>${c.site_total}</td><td>${c.dmg}</td><td>${c.lost}</td><td>${lo?'<span class="tag low">Reorder</span>':'<span class="tag" style="color:var(--ok)">OK</span>'}</td></tr>`}).join('')||'<tr><td colspan=6 class="mu">No items yet</td></tr>'}</table></div>`;
}
function txTable(list){
  const nmOf=id=>{const i=S.items.find(x=>x.id===id);return i?nm(i):'(deleted)'};
  return `<div class="tw"><table><tr><th>Date</th><th>Type</th><th>Item</th><th>Qty</th><th>Site</th><th>Note</th><th></th></tr>
  ${[...list].reverse().map(t=>`<tr><td>${t.date}</td><td>${t.type}</td><td>${nmOf(t.item)}</td><td>${t.qty}</td><td>${esc(t.site)}</td><td>${esc(t.note)}</td><td><button class="x" onclick="delTx('${t.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan=7 class="mu">No records</td></tr>'}</table></div>`;
}
const uid=()=>Math.random().toString(36).slice(2,9);
function addItem(e){e.preventDefault();const f=new FormData(e.target);S.items.push({id:uid(),name:f.get('name').trim(),size:f.get('size').trim(),open:+f.get('open'),min:+f.get('min'),target:+f.get('target')});save();render()}
function delItem(id){if(confirm('Delete this item and its records?')){S.items=S.items.filter(i=>i.id!==id);S.tx=S.tx.filter(t=>t.item!==id);save();render()}}
function addTx(e){e.preventDefault();const f=new FormData(e.target),t={id:uid(),date:f.get('date'),type:f.get('type'),item:f.get('item'),qty:+f.get('qty'),site:(f.get('site')||'').trim(),note:(f.get('note')||'').trim()};
  if(!t.item)return alert('Add an item first');
  if((t.type==='Issue to site'||t.type==='Return from site')&&!t.site)return alert('Enter the site name');
  S.tx.push(t);save();render()}
function delTx(id){if(confirm('Delete this record?')){S.tx=S.tx.filter(t=>t.id!==id);save();render()}}
function dl(name,text,type){const a=document.createElement('a');a.href='data:'+type+';charset=utf-8,'+encodeURIComponent(text);a.download=name;a.click()}
const csv=r=>r.map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
function exportCSV(w){const m=calc();
  if(w==='order')dl('next-order.csv',csv([['Item','Size','In store','Order qty'],...S.items.filter(i=>m[i.id].store<=+i.min).map(i=>[i.name,i.size,m[i.id].store,Math.max(0,i.target-m[i.id].store)])]),'text/csv');
  else dl('movements.csv',csv([['Date','Type','Item','Size','Qty','Site','Note'],...S.tx.map(t=>{const i=S.items.find(x=>x.id===t.item)||{};return[t.date,t.type,i.name,i.size,t.qty,t.site,t.note]})]),'text/csv')}
function backup(){dl('uniform-backup-'+today()+'.json',JSON.stringify({items:S.items,tx:S.tx}),'application/json')}
function restore(e){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);S.items=d.items||[];S.tx=d.tx||[];save();render()}catch(x){alert('Invalid file')}};r.readAsText(e.target.files[0])}
render();
</script></body></html>
